<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOOT WEAR | Elite Footwear</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">NOIR <span>STEPS</span></div>
        
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <ul class="nav-links" id="nav-links">
            <li><a href="#men">Men</a></li>
            <li><a href="#women">Women</a></li>
            <li><a href="#sale">Sale</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <div class="hero">
            <div class="hero-text">
                <h1>UNLEASH YOUR MOTION</h1>
                <p>High quality shoes for performance and style.</p>
                <a href="#products" class="shop-btn">Shop Now</a>
            </div>
        </div>

        <section id="products" class="container">
            <h2 class="title">Featured Drops</h2>
            
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&h=600&q=80" alt="Vortex Runner">
                    </div>
                    <div class="product-info">
                        <h3>Vortex Runner</h3>
                        <p class="price">Rs. 5,000</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&h=600&q=80" alt="Luna Heel">
                    </div>
                    <div class="product-info">
                        <h3>Luna Heel</h3>
                        <p class="price">Rs. 7,000</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                </div>

                <div class="product-card">
                    <div class="product-img-wrapper">
                        <img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=600&h=600&q=80" alt="Horizon Skate">
                    </div>
                    <div class="product-info">
                        <h3>Horizon Skate</h3>
                        <p class="price">Rs. 2,000</p>
                        <button class="add-btn">Add to Cart</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 NOIR STEPS. All Rights Reserved.</p>
    </footer>

    <script src="/script.js"></script>
    
</body>
</html>
